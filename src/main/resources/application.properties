spring.config.import=optional:file:./.env[.properties]

spring.application.name=ISLab1
server.port=3313

spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.url=${DB_URL}
spring.jpa.hibernate.ddl-auto=update


jwt.secret=${JWT_SECRET}
jwt.expiration-seconds=28800


spring.datasource.hikari.pool-name=Z1rotaHP
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.keepalive-time=120000


spring.jpa.properties.hibernate.cache.use_second_level_cache=true
spring.jpa.properties.hibernate.cache.region.factory_class=infinispan
spring.jpa.properties.hibernate.cache.infinispan.cfg=org/infinispan/hibernate/cache/commons/builder/infinispan-configs-local.xml

spring.jpa.properties.jakarta.persistence.sharedCache.mode=ENABLE_SELECTIVE
spring.jpa.properties.hibernate.generate_statistics=true

spring.jpa.properties.hibernate.cache.infinispan.org.zirota.islab1.entity.Coordinates.expiration.max_idle=300000
spring.jpa.properties.hibernate.cache.infinispan.org.zirota.islab1.entity.Location.expiration.max_idle=300000


app.cache.statistics.logging-enabled=false

storage.minio.endpoint=${MINIO_ENDPOINT}
storage.minio.access-key=${MINIO_ROOT_USER}
storage.minio.secret-key=${MINIO_ROOT_PASSWORD}
storage.minio.bucket=imports

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB

app.import.recovery-interval-ms=60000



