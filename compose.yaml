services:
  minio:
    build:
      context: src/main/java/org/zirota/islab1
      dockerfile: docker/minio/Dockerfile
    image: islab-minio:local
    container_name: islab-minio

    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"

    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}

    volumes:
      - minio_data:/data

    restart: "no"

volumes:
  minio_data:
